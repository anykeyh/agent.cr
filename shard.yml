name: agent-cr
version: 0.1.1

description: |
  A Crystal shard for building agentic loops with OpenAI-compatible APIs.

authors:
  - Yacine Petitprez <anykeyh@gmail.com>

crystal: ">= 1.19.0"

license: MIT

development_dependencies:
  ameba:
    github: crystal-ameba/ameba
    version: ~> 1.7
  dotenv:
    github: gdotdesign/cr-dotenv
    version: ~> 1.0

# ameba 1.7 has no postinstall; this target lets `shards build ameba` produce
# the linter binary (see the Lint step in .github/workflows/ci.yml).
targets:
  ameba:
    main: lib/ameba/bin/ameba.cr
