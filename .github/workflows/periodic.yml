name: Periodic builds

on:
  schedule:
    # Daily at 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  build:
    name: Crystal ${{ matrix.crystal }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crystal: [latest, nightly]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Crystal ${{ matrix.crystal }}
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ matrix.crystal }}

      - name: Install dependencies
        run: shards install

      - name: Type-check library
        run: crystal build --no-codegen src/agent.cr

      - name: Run specs
        run: crystal spec
