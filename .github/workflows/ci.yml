name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Daily soak. Its job beyond the push/PR runs is the advisory matrix below:
    # noticing breakage in Crystal `latest` and `nightly` before a release does.
    - cron: "0 3 * * *"
  workflow_dispatch:

# A push that supersedes a running build cancels it. Nothing here is a deployment.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec:
    name: Crystal ${{ matrix.crystal }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Full pins, measured 2026-09-30: 1.19.0 is the lowest that passes.
        # 1.18.0 fails to compile because src requires the stdlib `sync` module,
        # which arrived in 1.19.0 — hence `crystal: ">= 1.19.0"` in shard.yml.
        crystal: ["1.19.0", "1.20.0", "1.21.0"]

    steps:
      - uses: actions/checkout@v4

      # The runner image's cached apt lists can lag behind the Ubuntu mirror
      # (package fetches 404 after a point release supersedes them), and
      # install-crystal apt-installs Crystal's system libraries without
      # refreshing them first.
      - name: Refresh apt package lists
        run: sudo apt-get update

      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ matrix.crystal }}

      # shard.lock is committed, so this resolves exactly what was tested locally.
      - name: Install dependencies
        run: shards install

      # Formatting and linting run on the main line only. `crystal tool format`
      # changes its output between releases, so checking it on an old compiler
      # tests the compiler rather than the code, and ameba needs a recent
      # Crystal to build at all.
      - name: Format
        if: matrix.crystal == '1.21.0'
        run: crystal tool format --check

      - name: Lint
        if: matrix.crystal == '1.21.0'
        run: shards build ameba && bin/ameba

      - name: Library compiles
        run: crystal build --no-codegen src/agent.cr

      - name: Specs
        run: crystal spec

      # An example that has drifted from the API is worse than no example, so
      # this failing is a CI failure rather than a warning. Examples pull in the
      # dev-only `dotenv` shard, so they only get compiled on the main line,
      # like the formatter and ameba.
      - name: Build every example
        if: matrix.crystal == '1.21.0'
        run: |
          set -e
          for app in examples/*.cr; do
            echo "-- $app"
            crystal build --no-codegen "$app"
          done

  # Bleeding-edge Crystal: latest and nightly. Advisory on purpose — upstream
  # breaking is upstream's business until it is released; this job exists to
  # give warning, not to block anything. It only runs on the daily schedule
  # (or a manual dispatch), not on every push.
  future-crystal:
    name: Crystal ${{ matrix.crystal }} (advisory)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true

    strategy:
      fail-fast: false
      matrix:
        crystal: [latest, nightly]

    steps:
      - uses: actions/checkout@v4

      # Same apt-list staleness guard as the spec job.
      - name: Refresh apt package lists
        run: sudo apt-get update

      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ matrix.crystal }}

      - name: Install dependencies
        run: shards install

      - name: Library compiles
        run: crystal build --no-codegen src/agent.cr

      - name: Specs
        run: crystal spec
